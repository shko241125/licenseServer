<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head('감사 로그')}"></head>
<body class="app">
<aside th:replace="~{fragments/layout :: sidebar}"></aside>
<main class="content">
  <header class="page-header">
    <div><h1>감사 로그</h1><p class="desc">모든 행위는 해시 체인으로 연결되어 수정·삭제를 탐지할 수 있습니다.</p></div>
    <form th:action="@{/audit/verify}" method="post" class="page-actions"><button type="submit" class="btn-secondary">해시 체인 무결성 검사</button></form>
  </header>
  <th:block th:if="${chain}">
    <div th:if="${chain.ok()}" class="alert alert-ok" role="status"><div><span class="title">정상</span>
      <span th:text="${chain.checked()} + '건 검사, 마지막 해시 '"></span><span class="mono small copyable" th:text="${chain.lastHash()}"></span></div></div>
    <div th:unless="${chain.ok()}" class="alert alert-bad" role="alert"><div><span class="title">변조 탐지</span>
      <span th:text="'seq ' + ${chain.brokenAtSeq()} + ' — ' + ${chain.reason()}"></span></div></div>
  </th:block>
  <section class="card">
    <form th:action="@{/audit}" method="get" class="toolbar" role="search">
      <label class="sr-only" for="action">행위</label>
      <input id="action" name="action" th:value="${action}" placeholder="행위 코드 (예: ISSUE)" class="w-md mono">
      <button type="submit">필터</button>
      <a class="btn btn-ghost" th:if="${action != null and action != ''}" th:href="@{/audit}">초기화</a>
    </form>
    <div class="empty" th:if="${#lists.isEmpty(items)}"><div class="title">기록이 없습니다</div></div>
    <div class="table-wrap" th:unless="${#lists.isEmpty(items)}">
      <table class="table">
        <thead><tr><th class="num">#</th><th>시각(KST)</th><th>사용자</th><th>행위</th><th>대상</th><th>IP</th><th>상세</th></tr></thead>
        <tbody>
        <tr th:each="e : ${items}">
          <td class="num faint" th:text="${e.seq()}"></td>
          <td class="nowrap" th:text="${@fmt.kst(e.at())}"></td>
          <td th:text="${e.actor()}"></td>
          <td><span class="badge badge-plain mono" th:text="${e.action()}"></span></td>
          <td class="mono small wrap" th:text="${e.target()}"></td>
          <td class="mono small nowrap" th:text="${e.clientIp()}"></td>
          <td class="detail-json wrap" th:text="${e.detailJson()}"></td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>
</body>
</html>
