<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head('로그인')}"></head>
<body>
<main class="center">
  <h1>라이선스 발급 서버</h1>
  <p class="flash error" th:if="${param.error}">로그인에 실패했습니다. 계정이 잠겼거나 정보가 올바르지 않을 수 있습니다.</p>
  <p class="flash info" th:if="${param.logout}">로그아웃했습니다.</p>
  <p class="flash error" th:if="${param.expired}">세션이 만료되었습니다. 다시 로그인하세요.</p>
  <p class="flash error" th:if="${param.tempExpired}">임시 비밀번호가 만료되었습니다. 관리자에게 비밀번호 재발급을 요청하세요.</p>
  <form th:action="@{/login}" method="post">
    <label>사용자명 <input name="username" required autofocus autocomplete="username"></label>
    <label>비밀번호 <input type="password" name="password" required autocomplete="current-password"></label>
    <p><button>로그인</button></p>
  </form>
</main>
</body>
</html>
