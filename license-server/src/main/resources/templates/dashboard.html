<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head('대시보드')}"></head>
<body class="app">
<aside th:replace="~{fragments/layout :: sidebar}"></aside>
<main class="content">
  <header class="page-header">
    <div><h1>대시보드</h1><p class="desc">서명 키 상태와 만료 예정·최근 발급 현황입니다.</p></div>
    <div class="page-actions" th:if="${roles.contains('ROLE_ISSUER')}"><a class="btn" th:href="@{/licenses/new}">새 라이선스 발급</a></div>
  </header>

  <section class="metrics">
    <div class="card metric">
      <span class="label">서명 키</span>
      <span><span th:replace="~{fragments/layout :: badge(${keyState})}"></span></span>
      <span class="meta mono" th:if="${fingerprint}" th:text="'지문 ' + ${#strings.substring(fingerprint,0,16)} + '…'"></span>
      <span class="err" th:if="${keyError}" th:text="${keyError}"></span>
      <a class="small" th:if="${keyState.name() == 'SEALED' and roles.contains('ROLE_ADMIN')}" th:href="@{/keys}">해제하기 →</a>
    </div>
    <div class="card metric">
      <span class="label">30일 내 만료</span>
      <span class="value"><th:block th:text="${#lists.size(expiring)}">0</th:block><small>건</small></span>
      <span class="meta">갱신 발급 대상</span>
    </div>
    <div class="card metric">
      <span class="label">최근 발급</span>
      <span class="value"><th:block th:text="${#lists.size(recent)}">0</th:block><small>건</small></span>
      <span class="meta">최근 생성 순</span>
    </div>
    <div class="card metric">
      <span class="label">서버 시각</span>
      <span class="nowrap" th:text="${@fmt.kst(now)}"></span>
      <span class="meta nowrap" th:text="${@fmt.utc(now)}"></span>
    </div>
  </section>

  <div class="stack">
    <section class="card">
      <div class="card-head"><div><h2>30일 내 만료 예정</h2><div class="sub">유예 기간 시작 전에 갱신본을 반입해야 합니다.</div></div></div>
      <div class="empty" th:if="${#lists.isEmpty(expiring)}"><div class="title">만료 예정인 라이선스가 없습니다</div></div>
      <div class="table-wrap" th:unless="${#lists.isEmpty(expiring)}">
        <table class="table">
          <thead><tr><th>만료(KST)</th><th class="num">남은 일수</th><th>사이트</th><th>프로젝트</th><th></th></tr></thead>
          <tbody>
          <tr th:each="l : ${expiring}" th:with="d=${@fmt.daysUntil(now, l.notAfter())}">
            <td class="nowrap" th:text="${@fmt.kst(l.notAfter())}"></td>
            <td class="num"><span class="badge badge-plain" th:classappend="${d <= 7} ? 'badge-bad' : 'badge-warn'" th:text="${d} + '일'"></span></td>
            <td class="mono" th:text="${l.siteId()}"></td>
            <td><a th:href="@{/licenses/{id}(id=${l.licenseId()})}" th:text="${l.projectName()}"></a></td>
            <td class="num nowrap"><a class="btn btn-secondary btn-sm" th:href="@{/licenses/{id}(id=${l.licenseId()})}">상세</a>
              <a class="btn btn-sm" th:if="${roles.contains('ROLE_ISSUER')}" th:href="@{/licenses/new(from=${l.licenseId()})}">갱신 발급</a></td>
          </tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <div class="card-head"><h2>최근 발급</h2><a class="small" th:href="@{/licenses}">전체 이력 →</a></div>
      <div class="empty" th:if="${#lists.isEmpty(recent)}"><div class="title">발급 이력이 없습니다</div></div>
      <div class="table-wrap" th:unless="${#lists.isEmpty(recent)}">
        <table class="table">
          <thead><tr><th>생성(KST)</th><th>상태</th><th>프로젝트</th><th>사이트</th><th class="num">온라인</th><th class="num">오프라인</th><th>발급자</th></tr></thead>
          <tbody>
          <tr th:each="l : ${recent}">
            <td class="nowrap"><a th:href="@{/licenses/{id}(id=${l.licenseId()})}" th:text="${@fmt.kst(l.createdAt())}"></a></td>
            <td><span th:replace="~{fragments/layout :: badge(${l.status()})}"></span></td>
            <td><a th:href="@{/licenses/{id}(id=${l.licenseId()})}" th:text="${l.projectName()}"></a></td>
            <td class="mono" th:text="${l.siteId()}"></td>
            <td class="num" th:text="${l.onlineStt()}"></td><td class="num" th:text="${l.offlineStt()}"></td>
            <td th:text="${l.issuedByName()}"></td>
          </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>
</main>
</body>
</html>
