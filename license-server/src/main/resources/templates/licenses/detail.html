<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head('라이선스 상세')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main>
  <h1>라이선스 <span class="mono" th:text="${lic.licenseId()}"></span></h1>
  <p class="flash info" th:if="${param.issued}">발급했습니다. 파일을 내려받아 반입 절차에 따라 전달하세요.</p>
  <div th:replace="~{fragments/layout :: flash}"></div>
  <p class="row">
    <b th:class="'s-' + ${lic.status()}" th:text="${lic.status()}"></b>
    <a class="button" th:if="${lic.licenseText() != null}" th:href="@{/licenses/{id}/download(id=${lic.licenseId()})}">license.lic 다운로드</a>
    <a class="button secondary" th:if="${roles.contains('ROLE_ISSUER')}" th:href="@{/licenses/new(from=${lic.licenseId()})}">이 건으로 갱신 발급</a>
  </p>
  <table>
    <tr><th>프로젝트</th><td th:text="${lic.projectName()}"></td></tr>
    <tr><th>사이트</th><td th:text="${lic.siteId()}"></td></tr>
    <tr><th>유형</th><td th:text="${lic.licenseType()}"></td></tr>
    <tr><th>채널</th><td th:text="'온라인 ' + ${lic.onlineStt()} + ' / 오프라인 ' + ${lic.offlineStt()}"></td></tr>
    <tr><th>시작</th><td th:text="${@fmt.kst(lic.notBefore())} + '  (' + ${@fmt.utc(lic.notBefore())} + ')'"></td></tr>
    <tr><th>종료</th><td th:text="${@fmt.kst(lic.notAfter())} + '  (' + ${@fmt.utc(lic.notAfter())} + ')'"></td></tr>
    <tr><th>유예 종료</th><td th:text="${@fmt.kst(lic.graceUntil())} + ' (' + ${lic.gracePeriodDays()} + '일)'"></td></tr>
    <tr><th>발급</th><td th:text="${@fmt.kst(lic.issuedAt())} + ' · ' + ${lic.issuedByName()}"></td></tr>
    <tr th:if="${lic.renewedFrom()}"><th>원본</th><td><a class="mono" th:href="@{/licenses/{id}(id=${lic.renewedFrom()})}" th:text="${lic.renewedFrom()}"></a></td></tr>
    <tr><th>서명 키 지문</th><td class="mono" th:text="${lic.publicKeyFp()}"></td></tr>
    <tr th:if="${lic.licenseSha256()}"><th>파일 SHA-256</th><td class="mono" th:text="${lic.licenseSha256()}"></td></tr>
    <tr th:if="${lic.error()}"><th>오류</th><td class="err" th:text="${lic.error()}"></td></tr>
    <tr th:if="${lic.voidReason()}"><th>무효 사유</th><td th:text="${lic.voidReason()} + ' (' + ${@fmt.kst(lic.voidedAt())} + ')'"></td></tr>
  </table>
  <th:block th:if="${lic.licenseText() != null}"><h2>파일 내용</h2><pre th:text="${lic.licenseText()}"></pre></th:block>
  <th:block th:if="${lic.status().name() == 'ISSUED' and roles.contains('ROLE_ADMIN')}">
    <h2>무효 처리 (장부 표시용)</h2>
    <p class="muted">이미 반입된 파일을 무효화하지는 못합니다. 발급 장부에 무효로 표시만 합니다.</p>
    <form th:action="@{/licenses/{id}/void(id=${lic.licenseId()})}" method="post">
      <label>사유 <input name="reason" required maxlength="500"></label>
      <fieldset th:replace="~{fragments/layout :: reauth}"></fieldset>
      <button class="danger">무효 처리</button>
    </form>
  </th:block>
</main>
</body>
</html>
