<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head('라이선스 상세')}"></head>
<body class="app">
<aside th:replace="~{fragments/layout :: sidebar}"></aside>
<main class="content">
  <header class="page-header">
    <div>
      <div class="eyebrow"><a th:href="@{/licenses}">발급 이력</a> / 상세</div>
      <h1 th:text="${lic.projectName()}">프로젝트</h1>
      <p class="desc"><span th:replace="~{fragments/layout :: badge(${lic.status()})}"></span>
        <span class="mono copyable" th:text="${lic.licenseId()}"></span></p>
    </div>
    <div class="page-actions">
      <a class="btn" th:if="${lic.licenseText() != null}" th:href="@{/licenses/{id}/download(id=${lic.licenseId()})}">license.lic 다운로드</a>
      <a class="btn btn-secondary" th:if="${roles.contains('ROLE_ISSUER')}" th:href="@{/licenses/new(from=${lic.licenseId()})}">이 건으로 갱신 발급</a>
    </div>
  </header>

  <div class="alert alert-ok" role="status" th:if="${param.issued}"><div><span class="title">발급했습니다.</span> 파일을 내려받아 반입 절차에 따라 전달하세요.</div></div>
  <th:block th:replace="~{fragments/layout :: flash}"></th:block>
  <div class="alert alert-bad" role="alert" th:if="${lic.error()}"><div><span class="title">오류</span> <span th:text="${lic.error()}"></span></div></div>
  <div class="alert" th:if="${lic.voidReason()}"><div><span class="title">무효 처리됨</span> <span th:text="${lic.voidReason()} + ' (' + ${@fmt.kst(lic.voidedAt())} + ')'"></span></div></div>

  <div class="stack">
    <div class="grid-2">
      <section class="card">
        <div class="card-head"><h2>계약 정보</h2></div>
        <div class="card-body">
          <dl class="kv">
            <dt>프로젝트</dt><dd th:text="${lic.projectName()}"></dd>
            <dt>사이트</dt><dd class="mono" th:text="${lic.siteId()}"></dd>
            <dt>유형</dt><dd><span th:replace="~{fragments/layout :: badge(${lic.licenseType()})}"></span></dd>
            <dt>채널</dt><dd th:text="'온라인 ' + ${lic.onlineStt()} + ' / 오프라인 ' + ${lic.offlineStt()}"></dd>
            <dt>시작</dt><dd><div th:text="${@fmt.kst(lic.notBefore())}"></div><div class="cell-sub" th:text="${@fmt.utc(lic.notBefore())}"></div></dd>
            <dt>종료</dt><dd><div th:text="${@fmt.kst(lic.notAfter())}"></div><div class="cell-sub" th:text="${@fmt.utc(lic.notAfter())}"></div></dd>
            <dt>유예 종료</dt><dd th:text="${@fmt.kst(lic.graceUntil())} + ' (' + ${lic.gracePeriodDays()} + '일)'"></dd>
          </dl>
        </div>
      </section>
      <section class="card">
        <div class="card-head"><h2>발급 정보</h2></div>
        <div class="card-body">
          <dl class="kv">
            <dt>상태</dt><dd><span th:replace="~{fragments/layout :: badge(${lic.status()})}"></span></dd>
            <dt>발급</dt><dd th:text="${@fmt.kst(lic.issuedAt())} + ' · ' + ${lic.issuedByName()}"></dd>
            <th:block th:if="${lic.renewedFrom()}"><dt>원본</dt><dd><a class="mono" th:href="@{/licenses/{id}(id=${lic.renewedFrom()})}" th:text="${lic.renewedFrom()}"></a></dd></th:block>
            <dt>라이선스 ID</dt><dd class="mono copyable" th:text="${lic.licenseId()}"></dd>
            <dt>서명 키 지문</dt><dd class="mono copyable small" th:text="${lic.publicKeyFp()}"></dd>
            <th:block th:if="${lic.licenseSha256()}"><dt>파일 SHA-256</dt><dd class="mono copyable small" th:text="${lic.licenseSha256()}"></dd></th:block>
          </dl>
        </div>
      </section>
    </div>

    <section class="card" th:if="${lic.licenseText() != null}">
      <div class="card-head"><h2>파일 내용</h2><span class="sub">license.lic</span></div>
      <div class="card-body"><pre th:text="${lic.licenseText()}"></pre></div>
    </section>

    <section class="card danger-zone" th:if="${lic.status().name() == 'ISSUED' and roles.contains('ROLE_ADMIN')}">
      <div class="card-head"><div><h2>무효 처리</h2><div class="sub">장부 표시용입니다. 이미 반입된 파일을 무효화하지는 못합니다.</div></div></div>
      <form th:action="@{/licenses/{id}/void(id=${lic.licenseId()})}" method="post">
        <div class="card-body stack">
          <div class="field"><label for="reason" class="req">사유</label><input id="reason" name="reason" required maxlength="500"></div>
          <fieldset th:replace="~{fragments/layout :: reauth}"></fieldset>
        </div>
        <div class="card-foot"><button type="submit" class="btn-danger">무효 처리</button></div>
      </form>
    </section>
  </div>
</main>
</body>
</html>
