<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head('발급 확인')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main>
  <h1>발급 내용 확인</h1>
  <p>발급한 라이선스는 <b>취소할 수 없습니다</b>(오프라인 구조). 내용을 확인하세요.</p>
  <ul class="warn" th:unless="${#lists.isEmpty(warnings)}"><li th:each="w : ${warnings}" th:text="${w}"></li></ul>
  <table>
    <tr><th>프로젝트</th><td th:text="${contract.projectName()}"></td></tr>
    <tr><th>사이트</th><td th:text="${contract.siteId()}"></td></tr>
    <tr><th>유형</th><td th:text="${contract.licenseType()}"></td></tr>
    <tr><th>채널</th><td th:text="'온라인 ' + ${contract.onlineStt()} + ' / 오프라인 ' + ${contract.offlineStt()}"></td></tr>
    <tr><th>시작</th><td th:text="${@fmt.kst(contract.notBefore())} + '  (' + ${@fmt.utc(contract.notBefore())} + ')'"></td></tr>
    <tr><th>종료</th><td th:text="${@fmt.kst(contract.notAfter())} + '  (' + ${@fmt.utc(contract.notAfter())} + ')'"></td></tr>
    <tr><th>유예</th><td th:text="${contract.gracePeriodDays()} + '일'"></td></tr>
  </table>
  <details><summary>서명될 계약 JSON</summary><pre th:text="${contractJson}"></pre></details>
  <form th:action="@{/licenses/issue}" th:object="${form}" method="post" class="row">
    <input type="hidden" th:field="*{submissionToken}"><input type="hidden" th:field="*{renewedFrom}">
    <input type="hidden" th:field="*{projectName}"><input type="hidden" th:field="*{siteId}">
    <input type="hidden" th:field="*{licenseType}"><input type="hidden" th:field="*{onlineStt}">
    <input type="hidden" th:field="*{offlineStt}"><input type="hidden" th:field="*{notBeforeDate}">
    <input type="hidden" th:field="*{notBeforeTime}"><input type="hidden" th:field="*{notAfterDate}">
    <input type="hidden" th:field="*{notAfterTime}"><input type="hidden" th:field="*{gracePeriodDays}">
    <input type="hidden" th:field="*{warningNotice}">
    <button th:disabled="${keyState.name() != 'UNSEALED'}">발급</button>
    <button th:formaction="@{/licenses/edit}" class="secondary" formnovalidate>수정</button>
    <span class="err" th:if="${keyState.name() != 'UNSEALED'}">서명 키가 봉인 상태라 발급할 수 없습니다.</span>
  </form>
</main>
</body>
</html>
