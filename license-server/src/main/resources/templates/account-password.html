<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head('비밀번호 변경')}"></head>
<body>
<th:block th:if="${roles.contains('ROLE_VIEWER')}"><header th:replace="~{fragments/layout :: nav}"></header></th:block>
<main class="center">
  <h1>비밀번호 변경</h1>
  <p class="muted" th:unless="${roles.contains('ROLE_VIEWER')}">처음 로그인했거나 비밀번호가 초기화되어 변경이 필요합니다.</p>
  <p class="flash error" th:if="${error}" th:text="${error}"></p>
  <form th:action="@{/account/password}" method="post">
    <label>현재 비밀번호 <input type="password" name="current" required autocomplete="current-password"></label>
    <label>새 비밀번호 (12자 이상) <input type="password" name="next" required minlength="12" maxlength="128" autocomplete="new-password"></label>
    <label>새 비밀번호 확인 <input type="password" name="confirm" required minlength="12" maxlength="128" autocomplete="new-password"></label>
    <p><button>변경</button></p>
  </form>
</main>
</body>
</html>
