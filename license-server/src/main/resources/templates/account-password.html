<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head('비밀번호 변경')}"></head>
<!-- 로그인을 마친 사용자는 앱 화면 안에서, 첫 로그인(변경 강제) 단계에서는 인증 화면으로 보인다 -->
<body th:class="${roles.contains('ROLE_VIEWER')} ? 'app'">
<th:block th:if="${roles.contains('ROLE_VIEWER')}">
  <aside th:replace="~{fragments/layout :: sidebar}"></aside>
  <main class="content">
    <header class="page-header"><div><h1>비밀번호 변경</h1><p class="desc">12자 이상, 사용자명을 포함하지 않는 비밀번호를 사용하세요.</p></div></header>
    <div class="card w-form">
      <form th:action="@{/account/password}" method="post">
        <div class="card-body stack">
          <div class="alert alert-bad" role="alert" th:if="${error}"><div th:text="${error}"></div></div>
          <div class="field"><label for="current">현재 비밀번호</label><input id="current" type="password" name="current" required autocomplete="current-password"></div>
          <div class="field"><label for="next">새 비밀번호</label><input id="next" type="password" name="next" required minlength="12" maxlength="128" autocomplete="new-password"><span class="hint">12자 이상</span></div>
          <div class="field"><label for="confirm">새 비밀번호 확인</label><input id="confirm" type="password" name="confirm" required minlength="12" maxlength="128" autocomplete="new-password"></div>
        </div>
        <div class="card-foot"><button type="submit">변경</button></div>
      </form>
    </div>
  </main>
</th:block>
<main class="auth" th:unless="${roles.contains('ROLE_VIEWER')}">
  <div class="auth-card">
    <div th:replace="~{fragments/layout :: authBrand}"></div>
    <div class="steps" aria-hidden="true"><span class="on"></span><span></span><span></span></div>
    <h1>비밀번호 변경</h1>
    <p class="lead">처음 로그인했거나 비밀번호가 초기화되어 변경이 필요합니다.</p>
    <form th:action="@{/account/password}" method="post">
      <div class="alert alert-bad" role="alert" th:if="${error}"><div th:text="${error}"></div></div>
      <div class="field"><label for="current">현재 비밀번호</label><input id="current" type="password" name="current" required autocomplete="current-password"></div>
      <div class="field"><label for="next">새 비밀번호</label><input id="next" type="password" name="next" required minlength="12" maxlength="128" autocomplete="new-password"><span class="hint">12자 이상, 사용자명 포함 불가</span></div>
      <div class="field"><label for="confirm">새 비밀번호 확인</label><input id="confirm" type="password" name="confirm" required minlength="12" maxlength="128" autocomplete="new-password"></div>
      <button type="submit" class="btn-block">변경</button>
    </form>
  </div>
</main>
</body>
</html>
