# 운영 기본값. 비밀값은 /run/secrets/<이름> 파일(docker secret)을 configtree 로 읽어 같은 이름의 속성이 된다.
spring:
  application:
    name: license-server
  config:
    import: "optional:configtree:/run/secrets/"
  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/license}
    username: license_app
    password: ${db_app_password:}
  flyway:
    user: license_owner
    password: ${db_owner_password:}
  servlet:
    multipart:
      max-file-size: 64KB
      max-request-size: 128KB
  thymeleaf:
    cache: true

server:
  port: 8443
  ssl:
    enabled: true
    key-store: /data/tls/keystore.p12
    key-store-type: PKCS12
    key-store-password: ${tls_keystore_password:}
  error:
    whitelabel:
      enabled: false
    include-stacktrace: never
    include-message: never
    include-exception: false
  servlet:
    session:
      timeout: 15m
      tracking-modes: cookie
      cookie:
        name: __Host-LSID
        http-only: true
        secure: true
        same-site: strict
        path: /

management:
  server:
    port: 8081
    address: 127.0.0.1
    ssl:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

license:
  licensectl-path: /opt/licensectl
  sealed-key-path: /data/key/sealed-key.json
  expected-public-key-fingerprint: ${LICENSE_PUBLIC_KEY_FP:}
  auto-reseal-after: 8h
  data-key-file: /run/secrets/data_key
  zone: Asia/Seoul
  session-absolute-timeout: 8h
  temp-password-ttl: ${LICENSE_TEMP_PASSWORD_TTL:72h}   # 관리자가 정한 임시 비밀번호의 유효 시간 (계획서 §13)
  bootstrap:
    admin-username: ${LICENSE_BOOTSTRAP_ADMIN:admin}
    password-file: /run/secrets/initial_admin_password
  default-warning-notice: >-
    This software license is geographically restricted to the designated site.
    Unauthorized replication or exceeding allowed channels is strictly prohibited.
